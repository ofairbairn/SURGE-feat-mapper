data:
  train_features: 'C:/Users/Bipo1/Downloads/MNIST Data/mnist_train_features.npy'
  train_targets: 'C:/Users/Bipo1/Downloads/MNIST Data/mnist_train_targets.npy'
  test_features: 'C:/Users/Bipo1/Downloads/MNIST Data/mnist_test_features.npy'
  test_targets: 'C:/Users/Bipo1/Downloads/MNIST Data/mnist_test_targets.npy'
  csv_out: runs/mnist/mnist.csv

workflow:
  output_dir: .
  run_tag: mnist
  overwrite_existing_run: true
  test_fraction: 0.2
  val_fraction: 0.1
  standardize_inputs: false
  standardize_outputs: false
  seed: 42
  task_type: classification
  predictions_format: parquet
  models:
    - key: pytorch.mnist_cnn
      name: MNIST_CNN
      params:
        epochs: 10
        batch_size: 32
        learning_rate: 0.001
        device: cpu
      store_predictions: true