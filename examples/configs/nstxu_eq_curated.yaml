# SURGE surrogate run on the NSTX equilibrium dataset after curation

dataset_path: "C:\\Users\\Bipo1\\Downloads\\New equilibrium dataset\\curated_surrogate.csv"
dataset_format: auto
metadata_path: examples/configs/nstxu_surrogate_meta.yaml

test_fraction: 0.2
val_fraction: 0.1
standardize_inputs: true
standardize_outputs: true
seed: 42

output_dir: .
run_tag: nstx_surr_curated
overwrite_existing_run: false

resources:
  device: cpu
  num_workers: 2

models:
  - key: sklearn.random_forest
    name: rf_baseline
    params:
      n_estimators: 300
      max_depth: 12
      min_samples_leaf: 2
      n_jobs: -1
      random_state: 42

  - key: pytorch.residual_mlp
    name: resmlp_baseline
    params:
      hidden_layers: [256, 128]
      n_epochs: 300
      learning_rate: 0.001
      dropout_rate: 0.2
      patience: 25
      random_state: 42
