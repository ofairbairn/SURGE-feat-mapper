# SURGE Workflow Configuration for MNIST Classification
# 
# This config trains multiple models on converted MNIST data (CSV/Parquet).
# The data is automatically split into train/val/test sets, and the CNN adapter
# records training history for visualization.

# Dataset configuration
dataset_path: "data/datasets/mnist_converted/mnist_train.parquet"  # or .csv
dataset_format: "auto"  # auto-detect from extension

# Metadata overrides to specify which columns are inputs/outputs
# (Since "digit" doesn't match auto-detection heuristics)
metadata_overrides:
  outputs: ["digit"]  # The target column for classification

# Task type (classification for MNIST digit recognition)
task_type: "classification"

# Train/validation/test split
test_fraction: 0.2    # 20% test
val_fraction: 0.1     # 10% validation (of remaining 80%)

# Data preprocessing
standardize_inputs: false   # pixels are already 0-255 or 0-1
standardize_outputs: false  # no output scaling for classification

# Random seed for reproducibility
seed: 42

# Output directory and run tag
output_dir: "runs"
run_tag: "mnist_classification_v2"
overwrite_existing_run: true  # set to false to prevent accidental overwrites

# Optional: output format for predictions
predictions_format: "parquet"

# ============================================================================
# Models to train
# ============================================================================
models:
  # Random Forest classifier
  - key: sklearn.random_forest
    name: "Random Forest"
    params:
      n_estimators: 100
      max_depth: 20
      random_state: 42
    store_predictions: true

  # PyTorch CNN (MNIST-optimized)
  - key: pytorch.mnist_cnn
    name: "CNN (MNIST)"
    params:
      epochs: 10
      batch_size: 32
      learning_rate: 1e-3
      device: "cpu"
    store_predictions: true

  # Neural Network (MLP)
  - key: pytorch.mlp
    name: "PyTorch MLP"
    params:
      epochs: 20
      batch_size: 64
      learning_rate: 1e-3
      hidden_layers: [128, 64]
      device: "cpu"
    store_predictions: true

# ============================================================================
# MLflow Integration
# ============================================================================

mlflow_tracking: false
mlflow_experiment: "mnist"

# ============================================================================
# Notes for this run
# ============================================================================
notes: |
  MNIST Classification Pipeline
  - Compares RF vs CNN performance
  - Training data: converted from .npy format
  - Output includes predictions and training history
