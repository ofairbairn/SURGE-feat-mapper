# SURGE workflow spec for Fashion-MNIST using the registered VAE adapter.
# Run with:
#   python examples/run_workflow.py --spec examples/configs/fashion_mnist_vae.yaml

dataset_path: data/datasets/fashion_mnist/fashion_mnist_all.csv
dataset_format: csv

# Label column for classification. All other columns are treated as inputs.
metadata_overrides:
  outputs: ["label"]

task_type: classification
test_fraction: 0.2
val_fraction: 0.1
standardize_inputs: true
standardize_outputs: false
seed: 42

output_dir: runs/fashion_mnist
run_tag: fashion_mnist_vae
overwrite_existing_run: true
predictions_format: parquet

resources:
  device: auto
  num_workers: 2

models:
  - key: pytorch.vae
    name: VAE_FashionMNIST
    params:
      task: classification
      latent_dim: 32
      hidden_dim: 256
      beta: 1.0
      regression_weight: 1.0
      n_epochs: 20
      learning_rate: 0.001
      batch_size: 256
      patience: 5
      random_state: 42
    request_uncertainty: false
    store_predictions: true

notes: |
  Fashion-MNIST VAE classification run.
  Dataset is expected to be generated by examples/fashion_mnist_vae_workflow.py
  from the 4 source .npy files (train/test features and targets).