# Fashion-MNIST: CNN + VAE classification workflow

dataset_path: data/datasets/fashion_mnist/fashion_mnist_all.csv
dataset_format: csv

metadata_overrides:
  outputs: ["label"]

task_type: classification

test_fraction: 0.2
val_fraction: 0.1

standardize_inputs: false
standardize_outputs: false

seed: 42

output_dir: runs/fashion_mnist
run_tag: fashion_mnist_cnn_vae
overwrite_existing_run: true
predictions_format: parquet

models:
  - key: pytorch.mnist_cnn
    name: FashionMNIST_CNN
    params:
      epochs: 12
      batch_size: 32
      learning_rate: 0.001
      device: cpu
    store_predictions: true

  - key: pytorch.vae
    name: FashionMNIST_VAE
    params:
      task: classification
      latent_dim: 16
      hidden_dim: 128
      beta: 1.0
      n_epochs: 80
      batch_size: 256
      learning_rate: 0.001
      patience: 10
      random_state: 42
    store_predictions: true
