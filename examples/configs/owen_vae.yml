workflow:
  dataset_path: data/datasets/mnist_converted/mnist_train.parquet
  dataset_format: auto
  task_type: unsupervised

  models:
    - key: pytorch.owen_vae
      name: Owen_VAE
      params:
        latent_dim: 8
        hidden_dims: [128, 64]
        n_epochs: 150
        batch_size: 128
        beta: 1.0
        learning_rate: 0.001
        device: cpu
        verbose: true