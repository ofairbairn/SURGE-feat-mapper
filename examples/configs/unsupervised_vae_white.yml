workflow:
  dataset_path: "C:\\Users\\Bipo1\\Downloads\\VAE UCI Wine Data\\winequality-white-comma-unsupervised.csv"
  dataset_format: auto
  task_type: unsupervised
  unsupervised_ladder_mode: auto
  unsupervised_ladder_order: [pca, ae, vae]
  unsupervised_ladder_emit_all: true
  unsupervised_ladder_thresholds:
    pca_min_hopkins: 0.60
    ae_min_hopkins: 0.55
    ae_min_recon_improvement: 0.05
    vae_min_hopkins: 0.60
    vae_min_recon_improvement: 0.10

  models:
    - key: sklearn.pca
      name: pca
      params:
        n_components: 8
        svd_solver: auto
        whiten: true

viz:
  include_hpo: false
  unsupervised_latent:
    color_by: cluster
    label_column: quality
    cluster_method: hdbscan
    hdbscan_min_cluster_size: 8
    hdbscan_min_samples: 3
    interactive_threshold: 50000
    interactive_hover_sample_frac: 0.02
    anomaly_quantile: 0.95
    latent_quality_n_neighbors: 10
  unsupervised_reconstruction:
    top_n_features: 6
    worst_n_samples: 25
    anomaly_quantile: 0.95
    include_image_panels: false