# PNW seismology: 1D CNN + VAE regression workflow (sequence-to-sequence)

dataset_path: data/datasets/pnw_seismic/pnw_seq2seq.csv
dataset_format: csv

task_type: regression

test_fraction: 0.2
val_fraction: 0.1

standardize_inputs: true
standardize_outputs: true

seed: 42

output_dir: runs/pnw_seismic
run_tag: pnw_cnn1d_vae
overwrite_existing_run: true
predictions_format: parquet

models:
  - key: pytorch.cnn1d
    name: PNW_CNN1D
    params:
      hidden_channels: 64
      n_layers: 4
      kernel_size: 5
      dropout: 0.05
      n_epochs: 120
      learning_rate: 0.001
      batch_size: 8
      patience: 20
      random_state: 42
    store_predictions: true

  - key: pytorch.vae
    name: PNW_VAE
    params:
      task: regression
      latent_dim: 32
      hidden_dim: 256
      beta: 1.0
      regression_weight: 1.0
      n_epochs: 120
      batch_size: 16
      learning_rate: 0.001
      patience: 20
      random_state: 42
    store_predictions: true
