workflow:
  dataset_path: "C:\\Users\\Bipo1\\Downloads\\VAE UCI Wine Data\\winequality-white-comma-unsupervised.csv"
  dataset_format: auto
  task_type: unsupervised

  models:
    - key: pytorch.owen_vae
      name: Owen_VAE
      params:
        latent_dim: 8
        hidden_dims: [128, 64]
        n_epochs: 150
        batch_size: 128
        beta: 1.0
        learning_rate: 0.001
        device: cpu
        verbose: true

viz:
  include_hpo: false
  unsupervised_latent:
    color_by: cluster
    label_column: quality
    cluster_method: kmeans
    n_clusters: 12
    interactive_threshold: 50000
    interactive_hover_sample_frac: 0.02
    anomaly_quantile: 0.95
    latent_quality_n_neighbors: 10
  unsupervised_reconstruction:
    top_n_features: 6
    worst_n_samples: 25
    anomaly_quantile: 0.95
    include_image_panels: false