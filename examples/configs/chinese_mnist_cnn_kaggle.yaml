# Chinese-MNIST (Kaggle) preprocessing + SURGE workflow config

# No longer needed BECAUSE I already converted the dataset to flattened csv
# conversion:
#   index_csv_path: C:/Users/Bipo1/Downloads/Kaggle Chinese MNIST Data/chinese_mnist.csv
#   images_dir: C:/Users/Bipo1/Downloads/Kaggle Chinese MNIST Data/data/data
#   output_csv_path: C:/Users/Bipo1/Downloads/Kaggle Chinese MNIST Data/chinese_mnist_flattened.csv
#   label_column: value
#   filename_template: input_{suite_id}_{sample_id}_{code}.jpg
#   normalize_features: true
#   target_size: [64, 64]
#   feature_prefix: pixel_
#   verbose: true

workflow:
  dataset_path: C:/Users/Bipo1/Downloads/Kaggle Chinese MNIST Data/chinese_mnist_flattened.csv #comment out this line if using conversion block
  dataset_format: csv
  metadata_overrides:
    outputs: [value]
  task_type: classification

  test_fraction: 0.2
  val_fraction: 0.1
  standardize_inputs: false
  standardize_outputs: false
  seed: 42

  output_dir: .
  run_tag: chinese_mnist_kaggle
  overwrite_existing_run: true
  predictions_format: parquet

  models:
    - key: pytorch.mnist_cnn
      name: MNIST_CNN
      params:
        input_size: [64, 64]
        input_channels: 1
        hidden_channels: [32, 64, 128]
        epochs: 100
        batch_size: 35
        learning_rate: 0.0001
        weight_decay: 0.01
        dropout2d: 0.2
        use_lr_scheduler: true
        lr_scheduler_factor: 0.5
        lr_scheduler_patience: 2
        lr_scheduler_min_lr: 0.000001
        early_stopping: true
        early_stopping_patience: 5
        early_stopping_min_delta: 0.0001
        device: cpu
        verbose: true
      store_predictions: true